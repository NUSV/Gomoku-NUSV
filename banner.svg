    <circle cx="70" cy="-10" r="26" fill="#1c1917" stroke="#f8fafc" stroke-width="3"/>
    <circle cx="130" cy="8" r="16" fill="#f8fafc"/>
    <circle cx="24" cy="44" r="8" fill="#a8a29e"/>
  </g>
  <text x="64" y="108" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">Gomoku-NUSV</text>
  <text x="66" y="146" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="23" fill="#fcd34d">Five in a Row, anywhere</text>
  <text x="66" y="176" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#a8a29e">macOS - Windows - iOS - Android - on-device AI opponents</text>
  <g transform="translate(64, 202)">
