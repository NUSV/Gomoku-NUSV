<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="Gomoku-NUSV banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="0.6" stop-color="#292524"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M 46 0 L 0 0 0 46" fill="none" stroke="#fbbf24" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="240" rx="24" fill="url(#bg)"/>
  <rect width="960" height="240" rx="24" fill="url(#glow)"/>
  <rect width="960" height="240" rx="24" fill="url(#grid)"/>
  <g transform="translate(690, 130)">
